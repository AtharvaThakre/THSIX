# Safety net for Shiprocket order webhooks that don't arrive: every 15 minutes, GitHub Actions
# calls /api/orders/reconcile, which creates any Shiprocket Checkout order from the last few
# hours that isn't in Shopify yet. Orders already in Shopify are skipped.
# Scheduled workflows run from the default branch only.
#
# Setup: the same THSIX_CRON_SECRET secret as catalog-sync.yml.
# Backfill: Actions > Order reconcile > Run workflow, with a larger "hours" (e.g. 168).
name: Order reconcile

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: 'How many hours back to check'
        default: '3'
      order_id:
        description: 'Or: one Shiprocket order ID to recover (leave empty to scan by hours)'
        default: ''
      mode:
        description: 'With order_id: create (default), inspect payment fields, or fix a partial-COD order (preview first, then apply)'
        type: choice
        default: create
        options:
          - create
          - inspect
          - fix-partial-preview
          - fix-partial-apply
      force:
        description: 'With order_id: create it even if Shiprocket says unpaid/not placed (created as unpaid in Shopify)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: order-reconcile

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /api/orders/reconcile
        env:
          CRON_SECRET: ${{ secrets.THSIX_CRON_SECRET }}
          SITE_URL: ${{ vars.THSIX_SITE_URL || 'https://www.thsix.com' }}
          HOURS: ${{ inputs.hours || '3' }}
          ORDER_ID: ${{ inputs.order_id }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          MODE: ${{ inputs.mode || 'create' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::THSIX_CRON_SECRET is not set; skipping order reconcile."
            exit 0
          fi
          case "$ORDER_ID" in (*[!A-Za-z0-9_-]*) echo "::error::order_id has invalid characters"; exit 1;; esac
          case "$MODE" in
            inspect) EXTRA='&inspect=1';;
            fix-partial-preview) EXTRA='&fix_partial=1';;
            fix-partial-apply) EXTRA='&fix_partial=1&apply=1';;
            *) EXTRA='';;
          esac
          if [ -n "$EXTRA" ] && [ -z "$ORDER_ID" ]; then echo "::error::mode $MODE needs an order_id"; exit 1; fi
          case "$HOURS" in (*[!0-9]*|'') echo "::error::hours must be a number"; exit 1;; esac
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/orders/reconcile?hours=$HOURS&order_id=$ORDER_ID&force=$FORCE$EXTRA")
          cat response.json; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Order reconcile failed with HTTP $status"
            exit 1
          fi
