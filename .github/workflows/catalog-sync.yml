# Daily Shiprocket catalogue sync for the Hydrogen/Oxygen storefront.
# Oxygen has no cron, so GitHub Actions calls /api/catalog/sync daily at 20:30 UTC (02:00 IST).
# Scheduled workflows run from the default branch only.
#
# Setup (GitHub repo > Settings > Secrets and variables > Actions):
#   secret   THSIX_CRON_SECRET  = the CRON_SECRET configured on Oxygen
#   variable THSIX_SITE_URL     = https://www.thsix.com (optional; this is the default)
name: Catalog sync

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /api/catalog/sync
        env:
          CRON_SECRET: ${{ secrets.THSIX_CRON_SECRET }}
          SITE_URL: ${{ vars.THSIX_SITE_URL || 'https://www.thsix.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::THSIX_CRON_SECRET is not set; skipping catalogue sync."
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/catalog/sync")
          cat response.json; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Catalogue sync failed with HTTP $status"
            exit 1
          fi
