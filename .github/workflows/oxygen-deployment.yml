# Deploys the Hydrogen storefront in hydrogen/ to Shopify Oxygen on every push.
# Oxygen picks the environment from the branch: `main` -> Production, any other branch ->
# Preview (Shopify admin > Hydrogen > Storefront settings > Environments and variables).
# Runtime variables (Shiprocket, Resend, Meta, ...) live in those Oxygen environments, not here.
#
# Setup (once): Shopify admin > Hydrogen > THSIX storefront > Storefront settings >
# Oxygen deployments > Deployment tokens > create a token, then save it in
# GitHub repo > Settings > Secrets and variables > Actions as the secret OXYGEN_DEPLOYMENT_TOKEN.
name: Deploy to Oxygen

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: oxygen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hydrogen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hydrogen/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: API handler tests
        run: npm test

      - name: Build and deploy to Oxygen
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN }}
        run: |
          if [ -z "$SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN" ]; then
            echo "::error::The OXYGEN_DEPLOYMENT_TOKEN secret is not set (see the setup note at the top of this workflow)."
            exit 1
          fi
          npx shopify hydrogen deploy
